<?xml version="1.0" encoding="UTF-8"?>
<!-- README hero. Render with `npm run render:hero`. The screenshots sit beside this file;
     each viewBox="112 75 2760 1832" below crops the browser window out of its 2984x2054 capture. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000"
     font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="84" y1="-145" x2="2316" y2="1145">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1ecf8"/>
      <stop offset="1" stop-color="#fbe8ee"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#3f9b2b"/>
      <stop offset="0.5" stop-color="#6b4bbd"/>
      <stop offset="1" stop-color="#c0276a"/>
    </linearGradient>
    <clipPath id="window"><rect width="900" height="597.4" rx="10.8"/></clipPath>
    <clipPath id="window-front"><rect width="1000" height="663.8" rx="12"/></clipPath>
    <filter id="window-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#1e143c" flood-opacity="0.35"/>
    </filter>
    <filter id="pill-shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="2400" height="1000" fill="url(#bg)"/>

  <!-- Windows climb right at -7 degrees, front last; the canvas edge crops the back two on purpose. -->
  <g transform="translate(1095 421.3) rotate(-7 450 298.7)" filter="url(#window-shadow)">
    <g clip-path="url(#window)">
      <svg width="900" height="597.4" viewBox="112 75 2760 1832">
        <image href="micropython.png" width="2984" height="2054"/>
      </svg>
    </g>
  </g>
  <g transform="translate(1735 6.3) rotate(-7 450 298.7)" filter="url(#window-shadow)">
    <g clip-path="url(#window)">
      <svg width="900" height="597.4" viewBox="112 75 2760 1832">
        <image href="cpp.png" width="2984" height="2054"/>
      </svg>
    </g>
  </g>
  <g transform="translate(1320 188.1) rotate(-7 500 331.9)" filter="url(#window-shadow)">
    <g clip-path="url(#window-front)">
      <svg width="1000" height="663.8" viewBox="112 75 2760 1832">
        <image href="default.png" width="2984" height="2054"/>
      </svg>
    </g>
  </g>

  <g font-weight="800" font-size="88" letter-spacing="-1.76">
    <text x="140" y="376" fill="#2a2145">BBC micro:bit</text>
    <text x="140" y="464" fill="url(#title)">VS Code Web IDE</text>
  </g>
  <g font-size="34" fill="#5b5272">
    <text x="140" y="541">Write Python or C++ for micro:bit, run it in a MicroPython</text>
    <text x="140" y="587">simulator, flash it to your board, and connect to a</text>
    <text x="140" y="633">to a serial terminal, all from your browser.</text>
  </g>

  <g font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="690" width="240" height="56" rx="28" fill="#6b4bbd" filter="url(#pill-shadow)"/>
    <text x="260" y="728">MicroPython</text>
    <rect x="398" y="690" width="112" height="56" rx="28" fill="#c0276a" filter="url(#pill-shadow)"/>
    <text x="454" y="728">C++</text>
  </g>
</svg>
