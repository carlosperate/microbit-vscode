<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>micro:bit Web IDE</title>

		<!-- Mobile tweaks -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="micro:bit">

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" href="./favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="./manifest.json">
		<link data-name="vs/workbench/workbench.web.main" rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
	</head>

	<body aria-label=""></body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./rebase.js"></script>
	<script src="./vscode/out/vs/loader.js"></script>
	<script src="./vscode/out/vs/webPackagePaths.js"></script>
	<script>
		const BASE = new URL('.', document.baseURI).href.replace(/\/$/, '');
		Object.keys(self.webPackagePaths).map(function (key) {
			self.webPackagePaths[key] = `${BASE}/vscode/node_modules/${key}/${self.webPackagePaths[key]}`;
		});
		require.config({
			baseUrl: `${BASE}/vscode/out`,
			recordStats: true,
			trustedTypesPolicy: window.trustedTypes?.createPolicy('amdLoader', {
				createScriptURL(value) { return value; }
			}),
			paths: self.webPackagePaths
		});
	</script>
	<script src="./vscode/out/vs/workbench/workbench.web.main.nls.js"></script>
	<script src="./vscode/out/vs/workbench/workbench.web.main.js"></script>
	<script>
		// Boot the workbench inline (replacing the upstream
		// `vs/code/browser/workbench/workbench.js` embedder) so we can pass
		// `IWorkbenchConstructionOptions.commands` — host-side commands that run
		// on the main thread and are callable from worker-side extensions via
		// `vscode.commands.executeCommand`. This is the canonical bridge for
		// browser APIs the extension host can't reach (e.g. `showDirectoryPicker`,
		// which is window-only).
		(async () => {
			const product = await (await fetch('./product.json')).json();
			const basePath = new URL('.', document.baseURI).pathname.replace(/\/$/, '');
			const proto = location.protocol.replace(':', '');
			if (Array.isArray(product.additionalBuiltinExtensions)) {
				product.additionalBuiltinExtensions = product.additionalBuiltinExtensions.map(
					(ext) => window.microbitRebase(ext, location.host, proto, basePath)
				);
			}
			window.product = product;

			const HANDLE_DB = 'microbit-local-handle';
			const HANDLE_STORE = 'handles';
			const HANDLE_KEY = 'root';
			function saveLocalFolderHandle(handle) {
				return new Promise((resolve, reject) => {
					const req = indexedDB.open(HANDLE_DB, 1);
					req.onupgradeneeded = () => req.result.createObjectStore(HANDLE_STORE);
					req.onerror = () => reject(req.error);
					req.onsuccess = () => {
						const db = req.result;
						const tx = db.transaction(HANDLE_STORE, 'readwrite');
						tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
						tx.oncomplete = () => resolve();
						tx.onerror = () => reject(tx.error);
					};
				});
			}

			require(['vs/workbench/workbench.web.main', 'vs/base/common/uri'], (api, uriMod) => {
				const opts = { ...product };
				opts.additionalBuiltinExtensions = product.additionalBuiltinExtensions.map((a) => uriMod.URI.revive(a));
				if (product.folderUri) {
					opts.workspaceProvider = {
						workspace: { folderUri: uriMod.URI.revive(product.folderUri) },
						// We never route workspace switching through this — the
						// `workspace-storage` extension swaps folders in-place via
						// `vscode.workspace.updateWorkspaceFolders`. The inert
						// `open: () => true` keeps vscode-web happy if anything
						// internal ever calls it.
						open: async () => true,
						trusted: true,
					};
				}
				opts.commands = [
					{
						// Host-side bridge for `showDirectoryPicker` (window-only API,
						// not reachable from the extension host worker). Picks a folder,
						// persists the `FileSystemDirectoryHandle` to IndexedDB so the
						// worker can pick it up via `loadStoredHandle`, returns boolean.
						id: 'microbit._pickLocalFolderHost',
						handler: async () => {
							if (typeof window.showDirectoryPicker !== 'function') return false;
							let handle;
							try {
								handle = await window.showDirectoryPicker({ mode: 'readwrite' });
							} catch (e) {
								return false; // user cancelled or denied
							}
							try {
								await saveLocalFolderHandle(handle);
							} catch (e) {
								console.error('Failed to persist local folder handle', e);
								return false;
							}
							return true;
						},
					},
				];
				api.create(document.body, opts);
			});
		})();
	</script>
</html>
